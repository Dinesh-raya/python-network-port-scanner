[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "port-scanner-pro"
version = "1.0.0"
description = "A professional, async network port scanner for security professionals and network administrators"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dinesh Raya", email = "dinesh@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
port-scanner = "port_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/Dinesh-raya/python-network-port-scanner"
Repository = "https://github.com/Dinesh-raya/python-network-port-scanner"
Issues = "https://github.com/Dinesh-raya/python-network-port-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/port_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]
